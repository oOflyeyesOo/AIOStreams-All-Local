name: Build Docker manager images
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-manager-images.yml'
      - 'docker/**'
      - 'tools/**'
      - 'init/**'
      - 'templates/**'
      - 'assets/**'
      - 'scripts/**'
      - 'tests/**'
      - 'index.html'
      - 'dashboard.html'
      - '.env.example'
      - 'docker-compose.yml'
      - 'compose.manager.yml'
      - 'compose.test.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: manager-images-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate packaged deployment
        run: |
          python3 -m pip install PyYAML==6.0.3
          python3 scripts/generate_manager_compose.py --check
          docker compose --env-file .env.example -f compose.manager.yml config --quiet
          docker compose -p aio-tests -f compose.test.yml run --rm tests
  publish:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: search-broker, target: search-broker, file: docker/packaged/Dockerfile}
          - {name: portal, target: portal, file: docker/packaged/Dockerfile}
          - {name: controller, target: controller, file: docker/packaged/Dockerfile}
          - {name: aiostreams, target: aiostreams, file: docker/packaged/Dockerfile}
          - {name: stremio-web, target: stremio-web, file: docker/packaged/Dockerfile}
          - {name: bootstrap, target: bootstrap, file: docker/packaged/Dockerfile}
          - {name: postgres-init, target: postgres-init, file: docker/packaged/Dockerfile}
          - {name: kitsu, target: '', file: docker/anime-kitsu/Dockerfile}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image namespace
        id: image
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/aio-local" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.prefix }}-${{ matrix.name }}:latest
            ${{ steps.image.outputs.prefix }}-${{ matrix.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=manager-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=manager-${{ matrix.name }}

  release-bundle:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve immutable release set
        env:
          AIO_IMAGE_TAG: ${{ github.sha }}
        run: |
          python3 -m pip install PyYAML==6.0.3
          export AIO_IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/aio-local"
          python3 tools/release_manager.py bundle --release "$GITHUB_SHA" --output release-bundle
          docker compose --env-file .env.example -f release-bundle/compose.release.yml config --quiet
      - name: Start and test the exact pinned images
        timeout-minutes: 20
        run: |
          set -eo pipefail
          cp .env.example release-bundle/fixture.env
          printf '\nADDON_PASSWORD=package-test-only-password\nBASE_URL=http://127.0.0.1:3001\nAIOMETADATA_HOST=http://127.0.0.1:4005\n' >> release-bundle/fixture.env
          echo "Starting release stack..."
          docker compose -p aio-release --env-file release-bundle/fixture.env -f release-bundle/compose.release.yml up -d --wait --wait-timeout 600
          cid=$(docker compose -p aio-release --env-file release-bundle/fixture.env -f release-bundle/compose.release.yml ps -q aiostreams)
          if [ "$(docker inspect --format '{{.RestartCount}}' "$cid")" != 0 ]; then
            echo '::error::AIOStreams restarted during first startup; refusing to publish a masked startup failure.'
            echo 'AIOStreams restarted during first startup; refusing to publish a masked startup failure.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          run_step() {
            local step_name="$1"
            shift
            echo "::group::Run $step_name"
            echo "### Run $step_name" >> "$GITHUB_STEP_SUMMARY"
            if ! "$@"; then
              local code=$?
              echo "::error::$step_name failed with exit code $code"
              echo "❌ **$step_name failed (exit code $code)**" >> "$GITHUB_STEP_SUMMARY"
              echo "::endgroup::"
              return $code
            fi
            echo "✅ **$step_name passed**" >> "$GITHUB_STEP_SUMMARY"
            echo "::endgroup::"
          }

          run_step "stack-check" docker compose -p aio-release --env-file release-bundle/fixture.env -f release-bundle/compose.release.yml --profile test run --rm stack-check
          run_step "check_optional_live" docker compose -p aio-release --env-file release-bundle/fixture.env -f release-bundle/compose.release.yml exec -T -e AIO_OPTIONAL_TEST_PROJECT=aio-release portal python3 - < tests/check_optional_live.py
          run_step "check_optional_presets_live" docker compose -p aio-release --env-file release-bundle/fixture.env -f release-bundle/compose.release.yml exec -T portal python3 - < tests/check_optional_presets_live.py
          run_step "check_routing_live" docker compose -p aio-release --env-file release-bundle/fixture.env -f release-bundle/compose.release.yml exec -T portal python3 - < tests/check_routing_live.py
          rm release-bundle/fixture.env
      - uses: actions/upload-artifact@v4
        with:
          name: aio-release-${{ github.sha }}
          path: release-bundle/
          retention-days: 90
      - name: Capture failed startup diagnostics
        if: failure()
        run: |
          echo "### Release Bundle Diagnostics" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          docker compose -p aio-release --env-file .env.example -f release-bundle/compose.release.yml ps -a >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          for svc in portal controller stack-bootstrap aiostreams infinidysk prowlarr; do
            echo "<details><summary>Logs for $svc</summary>" >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            docker compose -p aio-release --env-file .env.example -f release-bundle/compose.release.yml logs --tail 60 "$svc" >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo '</details>' >> "$GITHUB_STEP_SUMMARY"
          done
          cid=$(docker compose -p aio-release --env-file .env.example -f release-bundle/compose.release.yml ps -aq aiostreams)
          if [ -n "$cid" ]; then
            python3 tests/summarize_startup.py "$cid" >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          fi
      - name: Remove disposable release project
        if: always()
        run: docker compose -p aio-release --env-file .env.example -f release-bundle/compose.release.yml down --volumes --remove-orphans
