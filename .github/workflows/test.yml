name: Compose regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check workflow inputs
        run: |
          test -f docker-compose.yml
          test -f docker-compose.aio.yml
          test -f compose.test.yml
          test -f docker/all-in-one/Dockerfile
          test -f docker/all-in-one/portal_server.py
      - name: Verify generated manager configuration
        run: |
          python3 -m pip install PyYAML==6.0.3
          python3 scripts/generate_manager_compose.py --check
          docker compose --env-file .env.example -f compose.manager.yml config --quiet
      - name: Validate Compose definitions
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.example -f docker-compose.aio.yml config --quiet
          docker compose --env-file .env.example -f compose.test.yml config --quiet
          for profile in core scrapers proxies web tunnel all; do
            docker compose --env-file .env.example --profile "$profile" config --quiet
          done
      - name: Verify application service inventory
        run: python3 -m tests.check_inventory
      - name: Check optional integration configuration
        run: python3 -m tests.check_integrations
      - name: Portal and failure regression tests
        run: docker compose -p aio-tests -f compose.test.yml run --rm tests
      - name: PostgreSQL first and repeat initialization
        run: docker compose -p aio-tests -f compose.test.yml run --rm database-test
      - name: Web player first-visit settings
        run: docker compose -p aio-tests -f compose.test.yml run --rm browser-tests
      - name: Clean up test project
        if: always()
        run: docker compose -p aio-tests -f compose.test.yml down --volumes
