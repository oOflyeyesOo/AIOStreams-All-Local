      \ /prowlarr/config.xml;\n    fi;\n  fi;\n  chmod -R 777 /prowlarr /slicksync /nuvio /aiometadata /infinidysk /stremio-web\
      \ /debrid-search /postersplus /aiostreams 2>/dev/null || true;\n  if [ -f /infinidysk/session.key ]; then chmod 600\
