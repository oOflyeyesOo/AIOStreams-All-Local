      2026-10-15T22:00:00.000Z\\\"}}}' > /stremio-web/localStorage.json;\n  fi;\n  if [ ! -f /prowlarr/config.xml ]; then\n\
      \    echo '<Config><Port>9696</Port><UrlBase></UrlBase><BindAddress>*</BindAddress><ApiKey>${PROWLARR_API_KEY:-prowlarr_internal_secret_key_99}</ApiKey><AuthenticationMethod>External</AuthenticationMethod><AuthenticationRequired>DisabledForLocalAddresses</AuthenticationRequired><LogLevel>info</LogLevel><Branch>master</Branch><LaunchBrowser>False</LaunchBrowser><UpdateMechanism>BuiltIn</UpdateMechanism></Config>'\
      \ > /prowlarr/config.xml;\n  else\n    sed -i 's|<ApiKey>.*</ApiKey>|<ApiKey>${PROWLARR_API_KEY:-prowlarr_internal_secret_key_99}</ApiKey>|g'\
      \ /prowlarr/config.xml;\n    sed -i 's|<AuthenticationMethod>.*</AuthenticationMethod>|<AuthenticationMethod>External</AuthenticationMethod>|g'\
