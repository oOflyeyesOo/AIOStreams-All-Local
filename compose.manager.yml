  nuvio-data: {}
  aiometadata-data: {}
  infinidysk-data: {}
  stremio-web-data: {}
  debrid-search-data: {}
  postersplus-data: {}
  stremthru-data: {}
  mediaflow-data: {}
  subsense-data: {}
  redis-data: {}
  postgres-data: {}
