      \ fi;\n  if grep -q '\\\"uuid\\\": *null' /stremio-web/aiostreams_install.json 2>/dev/null; then rm -f /stremio-web/aiostreams_install.json;\
      \ fi;\n  if [ ! -f /stremio-web/localStorage.json ]; then\n    echo '{\\\"profile\\\":{\\\"auth\\\":null,\\\"addons\\\
