  shared-redis:
    image: redis:8-alpine
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    restart: unless-stopped
    volumes:
    - redis-data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
    - stremio-net
  init-postgres:
    image: ${AIO_IMAGE_PREFIX:-ghcr.io/ooflyeyesoo/aio-local}-postgres-init:${AIO_IMAGE_TAG:-latest}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    restart: 'no'
    depends_on:
      shared-postgres:
        condition: service_healthy
    environment:
    - PGPASSWORD=${POSTGRES_PASSWORD:-postgres_supersecret_db_pass_2026}
    volumes: []
    entrypoint:
    - sh
    - -c
    - "if [ -f /init-databases.sh ]; then\n  exec sh /init-databases.sh\nelse\n  echo \"[init-postgres] Waiting for shared-postgres...\"\
      \n  until psql -h shared-postgres -U postgres -d postgres -c \"SELECT 1;\" >/dev/null 2>&1; do sleep 1; done\n  for\
      \ db in zilean mediafusion aiometadata sootio; do\n    psql -h shared-postgres -U postgres -d postgres -c \"CREATE DATABASE\
      \ $$db;\" 2>/dev/null || true\n  done\n  echo \"[init-postgres] Done!\"\n  exit 0\nfi\n"
    networks:
    - stremio-net
  shared-postgres:
    image: postgres:16-alpine
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    restart: unless-stopped
    shm_size: 512mb
    environment:
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres_supersecret_db_pass_2026}
    volumes:
    - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres -d postgres
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks:
    - stremio-net
networks:
  stremio-net:
    driver: bridge
