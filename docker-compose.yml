x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  search-broker:
    image: python:3.11-alpine
    profiles: ["core", "scrapers", "all"]
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 128m
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "65532:65532"
    volumes:
      - ./tools/search_broker.py:/search_broker.py:ro
    command: ["python3", "-u", "/search_broker.py"]
    environment:
      - SEARCH_TIMEOUT=${SEARCH_TIMEOUT:-8}
      - SEARCH_WORKERS=${SEARCH_WORKERS:-4}
      - SEARCH_CACHE_TTL=${SEARCH_CACHE_TTL:-60}
      - SEARCH_FAILURE_COOLDOWN=${SEARCH_FAILURE_COOLDOWN:-120}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8091/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [stremio-net]

  stack-check:
    profiles: ["test"]
    image: python:3.11-alpine
    volumes:
      - ./init:/init:ro
      - ./tests/check_stack.py:/check_stack.py:ro
      - ./tests/check_streams.py:/check_streams.py:ro
      - ./tests/check_playback.py:/check_playback.py:ro
      - ./data/aiostreams:/app/data/aiostreams:ro
    command: python3 /check_stack.py
    environment:
      - MEDIAFUSION_REPLICAS=${MEDIAFUSION_REPLICAS:-0}
    networks:
      - stremio-net

  # ============================================================================
  # 0. BUILT-IN WEB PORTAL & SETUP HUB (PORT 8088)
  # ============================================================================

  controller:
    build:
      context: .
      dockerfile: docker/controller/Dockerfile
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    restart: unless-stopped
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    environment:
      - AIO_RELEASE_LOCK_B64=${AIO_RELEASE_LOCK_B64:-}
      - DOCKER_CONFIG=/tmp/docker-config
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - ./:/workspace:ro
      - control-socket:/runtime
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(socket.AF_UNIX); s.connect('/runtime/control.sock'); s.close()"]
      interval: 5s
      timeout: 3s
      retries: 10


  # ============================================================================
  # 0. BUILT-IN WEB PORTAL & SETUP HUB (PORT 8088)
  # ============================================================================
  portal:
    image: python:3.11-alpine
    container_name: aio-portal
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "8088:8088"
    volumes:
      - ./:/app
      - control-socket:/runtime
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
    working_dir: /app
    command: sh -c "apk add --no-cache docker-cli >/dev/null 2>&1; exec python3 -u /app/docker/all-in-one/portal_server.py"
    environment:
      - AIO_PROJECT_NAME=${COMPOSE_PROJECT_NAME}
      - COMPOSE_CONTROL_SOCKET=/runtime/control.sock
      - AIOSTREAMS_URL=http://aiostreams:3000
      - ADDON_PASSWORD=${ADDON_PASSWORD:-}
      - BASE_URL=${BASE_URL:-}
      - AIOMETADATA_HOST=${AIOMETADATA_HOST:-}
      - SIMKL_CLIENT_ID=${SIMKL_CLIENT_ID:-}
      - SIMKL_CLIENT_SECRET=${SIMKL_CLIENT_SECRET:-}
      - TRAKT_CLIENT_ID=${TRAKT_CLIENT_ID:-}
      - TRAKT_CLIENT_SECRET=${TRAKT_CLIENT_SECRET:-}
      - ANILIST_CLIENT_ID=${ANILIST_CLIENT_ID:-}
      - ANILIST_CLIENT_SECRET=${ANILIST_CLIENT_SECRET:-}
      - ANILIST_TOKEN=${ANILIST_TOKEN:-}
      - AIOMETADATA_TEMPLATE=${AIOMETADATA_TEMPLATE:-tamtaro-aiometadata-with-anime.json}
      - MEDIAFUSION_REPLICAS=${MEDIAFUSION_REPLICAS:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8088/healthz')\" || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - stremio-net

  # ============================================================================
  # 1. CORE AGGREGATOR & SUPER-ADDON
  # ============================================================================
  aiostreams:
    image: ghcr.io/viren070/aiostreams:latest
    container_name: aiostreams
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "/app/scripts/healthcheck.js"]
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 5m
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${AIOSTREAMS_MEM_LIMIT:-512m}
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "${PORT_AIOSTREAMS:-3001}:3000"
    environment:
      - PORT=3000
      - NODE_OPTIONS=--dns-result-order=ipv4first --max-old-space-size=384
      - BASE_URL=${BASE_URL:-http://localhost:3001}
      - SECRET_KEY=${SECRET_KEY:-e2c019d4536f9a039b56f8f1dfba8919634e2c8846bb1999252c79213bc01b09}
      - ADDON_PASSWORD=${ADDON_PASSWORD:-admin}
      - AIOSTREAMS_AUTH=admin:${ADDON_PASSWORD:-admin}
      - AIOSTREAMS_AUTH_PERMISSIONS=admin=admin
      - CONFIG_ACCESS_KEY=${ADDON_PASSWORD:-admin}
      - AIOSTREAMS_AUTH_REQUIRED=true
      - DATABASE_URI=sqlite:///data/db.sqlite
      - REDIS_URI=redis://shared-redis:6379/6
      - REDIS_URL=redis://shared-redis:6379/6
      - AIO_PRECACHE_NEXT_EPISODE=${AIO_PRECACHE_NEXT_EPISODE:-true}
      - ALLOW_PRIVATE_URLS=true
      - ALIASED_CONFIGURATIONS=${ALIASED_CONFIGURATIONS:-}
      - DEFAULT_AIO_UUID=${DEFAULT_AIO_UUID:-}
      - DEFAULT_AIO_ENCRYPTED_PASSWORD=${DEFAULT_AIO_ENCRYPTED_PASSWORD:-}

      # --- Internal Local Scraper Endpoints ---
      - COMET_URL=["http://comet:8000"]
      - MEDIAFUSION_URL=["http://mediafusion:8000"]
      - MEDIAFUSION_API_PASSWORD=${ADDON_PASSWORD:-admin}
      - SOOTIO_URL=["http://sootio:55771"]
      - METEOR_URL=["https://meteorfortheweebs.midnightignite.me"]

      # --- Internal Tracker Integrations ---
      - BUILTIN_PROWLARR_URL=http://prowlarr:9696
      - BUILTIN_PROWLARR_API_KEY=${PROWLARR_API_KEY:-prowlarr_internal_secret_key_99}

      # --- Local Debrid Proxy & Stream Router (MediaFlow & StremThru) ---
      - BUILTIN_STREMTHRU_URL=http://stremthru:8080
      - STREMTHRU_STORE_URL=http://stremthru:8080/stremio/store/
      - STREMTHRU_TORZ_URL=http://stremthru:8080/stremio/torz/
      - FORCE_PROXY_ENABLED=${FORCE_PROXY_ENABLED:-true}
      - FORCE_PROXY_ID=${FORCE_PROXY_ID:-builtin}
      - FORCE_PROXY_URL=${BASE_URL:-http://localhost:3000}
      - FORCE_PROXY_CREDENTIALS=admin:${ADDON_PASSWORD:-admin}
      - ENCRYPT_STREMTHRU_URLS=false
      - ENCRYPT_MEDIAFLOW_URLS=false

      # --- Metadata & Debrid Auto-Configuration ---
      - TMDB_API_KEY=${TMDB_API_KEY}
      - TVDB_API_KEY=${TVDB_API_KEY}
      - MDBLIST_API_KEY=${MDBLIST_API_KEY}
      - RPDB_API_KEY=${RPDB_API_KEY}
      - FANART_API_KEY=${FANART_API_KEY}
      - FETCH_TRAKT_ALIASES=true
      - EASYNEWS_USER=${EASYNEWS_USER:-}
      - EASYNEWS_PASSWORD=${EASYNEWS_PASSWORD:-}
      - DEFAULT_SERVICE_CREDENTIALS=premiumize.apiKey=${PREMIUMIZE_API_KEY}\nrealdebrid.apiKey=${REALDEBRID_API_KEY}\nalldebrid.apiKey=${ALLDEBRID_API_KEY}\ntorbox.apiKey=${TORBOX_API_KEY}\ndebridlink.apiKey=${DEBRIDLINK_API_KEY}\nnzbdav.apiKey=${SECRET_KEY:-e2c019d4536f9a039b56f8f1dfba8919634e2c8846bb1999252c79213bc01b09}\nnzbdav.url=http://infinidysk:3000\nnzbdav.username=admin\nnzbdav.password=${ADDON_PASSWORD:-admin}

      # --- Community Templates & SEL Auto-Sync (Tam-Taro & Vidhin05) ---
      - TEMPLATE_URLS=${TEMPLATE_URLS:-["https://raw.githubusercontent.com/Tam-Taro/SEL-Filtering-and-Sorting/refs/heads/main/Tamtaro-All-Templates-for-AIOStreams.json","https://raw.githubusercontent.com/Vidhin05/Releases-Regex/refs/heads/main/all-templates.json"]}
      - TEMPLATE_REFRESH_INTERVAL=${TEMPLATE_REFRESH_INTERVAL:-3600}
      - WHITELISTED_SYNC_REFRESH_INTERVAL=${WHITELISTED_SYNC_REFRESH_INTERVAL:-3600}
      - FEATURED_TEMPLATE_IDS=${FEATURED_TEMPLATE_IDS:-builtin.all-local-selfhosted,tamtaro.complete,Vidhin05.regex-template}
      - SEL_SYNC_ACCESS=${SEL_SYNC_ACCESS:-all}
      - WHITELISTED_REGEX_PATTERNS_URLS=${WHITELISTED_REGEX_PATTERNS_URLS:-["https://raw.githubusercontent.com/Vidhin05/Releases-Regex/main/English/regexes.json","https://raw.githubusercontent.com/Vidhin05/Releases-Regex/main/German/regexes.json","https://raw.githubusercontent.com/Tam-Taro/SEL-Filtering-and-Sorting/refs/heads/main/AIOStreams-SyncedURLs/Tamtaro-synced-excluded-regex.json","https://raw.githubusercontent.com/Tam-Taro/SEL-Filtering-and-Sorting/refs/heads/main/AIOStreams-SyncedURLs/Tamtaro-synced-french-regex.json","https://raw.githubusercontent.com/Tam-Taro/SEL-Filtering-and-Sorting/refs/heads/main/AIOStreams-SyncedURLs/Tamtaro-synced-for-nour-Regex.json","https://git.tamtaro.de/Excluded-Regex.json"]}
      - WHITELISTED_SEL_URLS=${WHITELISTED_SEL_URLS:-["https://raw.githubusercontent.com/Tam-Taro/SEL-Filtering-and-Sorting/refs/heads/main/AIOStreams-SyncedURLs/Tamtaro-synced-ESEs-extended.json","https://raw.githubusercontent.com/Tam-Taro/SEL-Filtering-and-Sorting/refs/heads/main/AIOStreams-SyncedURLs/Tamtaro-synced-ESEs-standard.json","https://raw.githubusercontent.com/Tam-Taro/SEL-Filtering-and-Sorting/refs/heads/main/AIOStreams-SyncedURLs/Tamtaro-synced-ISEs.json","https://raw.githubusercontent.com/Tam-Taro/SEL-Filtering-and-Sorting/refs/heads/main/AIOStreams-SyncedURLs/Tamtaro-synced-PSEs.json","https://raw.githubusercontent.com/Tam-Taro/SEL-Filtering-and-Sorting/refs/heads/main/AIOStreams-SyncedURLs/Tamtaro-synced-french-RSE.json","https://raw.githubusercontent.com/Tam-Taro/SEL-Filtering-and-Sorting/refs/heads/main/AIOStreams-SyncedURLs/Tamtaro-synced-for-nour-RSE.json","https://raw.githubusercontent.com/Vidhin05/Releases-Regex/main/English/expressions.json","https://raw.githubusercontent.com/Vidhin05/Releases-Regex/main/German/expressions.json","https://raw.githubusercontent.com/Vidhin05/Releases-Regex/main/English/legacy-expressions.json","https://git.tamtaro.de/PSE.json","https://git.tamtaro.de/ESE.json","https://git.tamtaro.de/ISE.json"]}
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    volumes:
      - ./data/aiostreams:/data
      - ./templates/builtin:/app/resources/templates:ro
      - ./docker/aiostreams/entrypoint.sh:/entrypoint.sh:ro
    networks:
      - stremio-net
    depends_on:
      init-postgres:
        condition: service_completed_successfully
      shared-redis:
        condition: service_healthy

  # ============================================================================
  # 2. LOCAL SCRAPERS & INDEXERS
  # ============================================================================

  # Comet (High-speed torrent/Debrid scraper querying local Prowlarr & Zilean)
  comet:
    image: ghcr.io/g0ldyy/comet:latest
    container_name: comet
    profiles: ["core", "scrapers", "all"]
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${COMET_MEM_LIMIT:-1024m}
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "${INTERNAL_BIND_IP:-127.0.0.1}:8000:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/manifest.json', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10m
    environment:
      # AIOStreams owns anime ID mapping; Comet receives normalized IMDb IDs.
      - ANIME_MAPPING_ENABLED=false
      - FASTAPI_PORT=8000
      - DATABASE_PATH=/app/data/comet.db
      - ADMIN_DASHBOARD_PASSWORD=${ADDON_PASSWORD:-admin}
      - PROXY_DEBRID_STREAM=false
      - INDEXER_MANAGER_TYPE=prowlarr
      - INDEXER_MANAGER_URL=http://search-broker:8091
      - INDEXER_MANAGER_API_KEY=${PROWLARR_API_KEY:-prowlarr_internal_secret_key_99}
      - INDEXER_MANAGER_TIMEOUT=${COMET_INDEXER_TIMEOUT:-8}
      - COMET_SCRAPING_TIMEOUT=${COMET_SCRAPING_TIMEOUT:-10}
      - COMET_DEBRID_TIMEOUT=${COMET_DEBRID_TIMEOUT:-8}
      - COMET_SCRAPE_TORRENT_TITLE_MATCH_THRESHOLD=${COMET_SCRAPE_TORRENT_TITLE_MATCH_THRESHOLD:-0.85}
      - SCRAPE_PROWLARR=true
      - SCRAPE_ZILEAN=true
      - SCRAPE_NYAA=false
      - SCRAPE_ANIMETOSHO=false
      - ZILEAN_URL=http://zilean:8181
      - STREMTHRU_URL=http://stremthru:8080
      - TMDB_API_KEY=${TMDB_API_KEY}
    volumes:
      - ./data/comet:/app/data
    networks:
      - stremio-net

  # MediaFusion (Multi-source scraper: Movies, Series, Live TV, Sports)
  mediafusion:
    image: mhdzumair/mediafusion:latest
    scale: ${MEDIAFUSION_REPLICAS:-0}
    container_name: mediafusion
    profiles: ["core", "scrapers", "all"]
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${MEDIAFUSION_MEM_LIMIT:-512m}
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "${INTERNAL_BIND_IP:-127.0.0.1}:8001:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:8000/manifest.json > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - HOST_URL=${MEDIAFUSION_HOST_URL:-http://localhost:8001}
      - IS_PUBLIC_INSTANCE=${MEDIAFUSION_PUBLIC:-true}
      - EGRESS_WATCHDOG_FAIL_THRESHOLD=25
      - POSTGRES_URI=postgresql://postgres:${POSTGRES_PASSWORD:-postgres_supersecret_db_pass_2026}@shared-postgres:5432/mediafusion
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres_supersecret_db_pass_2026}@shared-postgres:5432/mediafusion
      - REDIS_URL=redis://shared-redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-e2c019d4536f9a039b56f8f1dfba8919634e2c8846bb1999252c79213bc01b09}
      - API_PASSWORD=${ADDON_PASSWORD:-admin}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@mediafusion.local}
      - PROWLARR_URL=http://prowlarr:9696
      - BUILTIN_PROWLARR_API_KEY=${PROWLARR_API_KEY:-prowlarr_internal_secret_key_99}
      - PROWLARR_API_KEY=${PROWLARR_API_KEY:-prowlarr_internal_secret_key_99}
      - ZILEAN_URL=http://zilean:8181
      - IS_SCRAP_FROM_PROWLARR=${MEDIAFUSION_SCRAPE_PROWLARR:-false}
      - IS_SCRAP_FROM_ZILEAN=false
      - IS_SCRAP_FROM_TORRENTIO=false
      - IS_SCRAP_FROM_PUBLIC_INDEXERS=false
      - TMDB_API_KEY=${TMDB_API_KEY}
      - TVDB_API_KEY=${TVDB_API_KEY}
      - MDBLIST_API_KEY=${MDBLIST_API_KEY}
      - RPDB_API_KEY=${RPDB_API_KEY}
      - REALDEBRID_API_KEY=${REALDEBRID_API_KEY}
      - PREMIUMIZE_API_KEY=${PREMIUMIZE_API_KEY}
      - ALLDEBRID_API_KEY=${ALLDEBRID_API_KEY}
      - TORBOX_API_KEY=${TORBOX_API_KEY}
      - DEBRIDLINK_API_KEY=${DEBRIDLINK_API_KEY}
    volumes:
      - ./data/mediafusion:/app/data
    networks:
      - stremio-net
    depends_on:
      init-postgres:
        condition: service_completed_successfully
      shared-redis:
        condition: service_started

  # Sootio (Multi-source torrent/debrid scraper with FlareSolverr & direct HTML indexing)
  sootio:
    build:
      context: .
      dockerfile: docker/sootio/Dockerfile
    container_name: sootio
    profiles: ["scrapers", "all"]
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${SOOTIO_MEM_LIMIT:-768m}
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "${INTERNAL_BIND_IP:-127.0.0.1}:${PORT_SOOTIO:-55771}:55771"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:55771/manifest.json > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    environment:
      - PORT=55771
      - NODE_OPTIONS=--max-old-space-size=256
      - ADDON_URL=${SOOTIO_ADDON_URL:-http://sootio:55771}
      - LOG_LEVEL=info
      - TMDB_API_KEY=${TMDB_API_KEY}
      - TMDB_FALLBACK_ENABLED=true
      - ZILEAN_ENABLED=false
      - COMET_ENABLED=false
      - TORRENTIO_ENABLED=false
      - STREMTHRU_ENABLED=false
      - ZILEAN_URL=http://zilean:8181
      - ZILEAN_LIMIT=200
      - FLARESOLVERR_URL=http://flaresolverr:8191
      - FLARESOLVERR_MAX_CONCURRENT=2
      - TORRENT_1337X_ENABLED=false
      - BTDIG_ENABLED=true
      - BTDIG_MAX_PAGES=${SOOTIO_BTDIG_MAX_PAGES:-5}
      - MAGNETDL_ENABLED=true
      - SOOTIO_CURL_TIMEOUT_MS=${SOOTIO_CURL_TIMEOUT_MS:-5000}
      - SOOTIO_CONNECT_TIMEOUT_MS=${SOOTIO_CONNECT_TIMEOUT_MS:-2000}
      - SOOTIO_SOURCE_COOLDOWN_MS=${SOOTIO_SOURCE_COOLDOWN_MS:-120000}
      - SOOTIO_MAX_WORKERS=${SOOTIO_MAX_WORKERS:-4}
      - SOOTIO_MAX_PENDING=${SOOTIO_MAX_PENDING:-6}
      - DEFAULT_DEBRID_SERVICE=${DEFAULT_DEBRID_SERVICE:-Premiumize}
      - REALDEBRID_API_KEY=${REALDEBRID_API_KEY}
      - RD_API_KEY=${REALDEBRID_API_KEY}
      - ALLDEBRID_API_KEY=${ALLDEBRID_API_KEY}
      - TORBOX_API_KEY=${TORBOX_API_KEY}
      - PREMIUMIZE_API_KEY=${PREMIUMIZE_API_KEY}
      - DEBRIDLINK_API_KEY=${DEBRIDLINK_API_KEY}
      - DEBRID_API_KEY=${PREMIUMIZE_API_KEY}
      - EASYNEWS_USER=${EASYNEWS_USER:-}
      - EASYNEWS_PASSWORD=${EASYNEWS_PASSWORD:-}
    volumes:
      - ./docker/sootio/configuration.js:/app/lib/util/configuration.js:ro
      - ./docker/sootio/landingTemplate.js:/app/lib/util/landingTemplate.js:ro
      - ./data/sootio:/app/data
    networks:
      - stremio-net
    depends_on:
      - zilean
      - flaresolverr



  # ============================================================================
  # 3. FAST DMM TORRENT HASH CACHE (ZILEAN)
  # ============================================================================
  zilean:
    image: ipromknight/zilean:latest
    container_name: zilean
    profiles: ["scrapers", "all"]
    restart: unless-stopped
    logging: *default-logging
    cpu_shares: ${ZILEAN_CPU_SHARES:-256}
    cpus: ${ZILEAN_CPU_LIMIT:-1.5}
    mem_limit: ${ZILEAN_MEM_LIMIT:-3072m}
    deploy:
      resources:
        limits:
          cpus: '${ZILEAN_CPU_LIMIT:-1.5}'
          memory: ${ZILEAN_MEM_LIMIT:-3072m}
    ports:
      - "${INTERNAL_BIND_IP:-127.0.0.1}:8181:8181"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL 'http://localhost:8181/dmm/filtered?query=ping' > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    environment:
      - DOTNET_PROCESSOR_COUNT=${ZILEAN_THREADS:-2}
      - DOTNET_gcServer=1
      - Zilean__Database__Type=postgres
      - Zilean__Database__ConnectionString=Host=shared-postgres;Database=zilean;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres_supersecret_db_pass_2026}
      - Zilean__Dmm__ImportBatched=true
      - Zilean__Parsing__BatchSize=${ZILEAN_BATCH_SIZE:-500}
      - Zilean__Dmm__EnableScraping=${ZILEAN_ENABLE_SCRAPING:-true}
      - Zilean__Dmm__ScrapeSchedule=${ZILEAN_SCRAPE_SCHEDULE:-0 4 * * *}
      - Zilean__Dmm__MinimumReDownloadIntervalMinutes=1440
    networks:
      - stremio-net
    depends_on:
      init-postgres:
        condition: service_completed_successfully

  # ============================================================================
  # 4. TRACKER AGGREGATORS & CLOUDFLARE BYPASS
  # ============================================================================
  # One-shot bootstrap container to seed Prowlarr API keys from .env before it boots
  init-configs:
    image: alpine:latest
    container_name: init-configs
    restart: "no"
    logging: *default-logging
    volumes:
      - ./data/prowlarr:/prowlarr
      - ./data/slicksync:/slicksync
      - ./data/nuvio:/nuvio
      - ./data/aiometadata:/aiometadata
      - ./data/infinidysk:/infinidysk
      - ./data/stremio-web:/stremio-web
      - ./data/debrid-search:/debrid-search
      - ./data/postersplus:/postersplus
      - ./data/aiostreams:/aiostreams
    command: >
      sh -c "
        mkdir -p /prowlarr /slicksync /nuvio /aiometadata /infinidysk /stremio-web /debrid-search /postersplus /aiostreams;
        if grep -q '\"uuid\": *null' /aiostreams/aiostreams_install.json 2>/dev/null; then rm -f /aiostreams/aiostreams_install.json; fi;
        if grep -q '\"uuid\": *null' /stremio-web/aiostreams_install.json 2>/dev/null; then rm -f /stremio-web/aiostreams_install.json; fi;
        if [ ! -f /stremio-web/localStorage.json ]; then
          echo '{\"profile\":{\"auth\":null,\"addons\":[],\"addonsLocked\":false,\"settings\":{\"interfaceLanguage\":\"eng\",\"streamingServerUrl\":\"http://127.0.0.1:11470/\"}},\"streaming_server_urls\":{\"items\":{\"http://127.0.0.1:11470/\":\"2026-10-15T22:00:00.000Z\"}}}' > /stremio-web/localStorage.json;
        fi;
        if [ ! -f /prowlarr/config.xml ]; then
          echo '<Config><Port>9696</Port><UrlBase></UrlBase><BindAddress>*</BindAddress><ApiKey>${PROWLARR_API_KEY:-prowlarr_internal_secret_key_99}</ApiKey><AuthenticationMethod>External</AuthenticationMethod><AuthenticationRequired>DisabledForLocalAddresses</AuthenticationRequired><LogLevel>info</LogLevel><Branch>master</Branch><LaunchBrowser>False</LaunchBrowser><UpdateMechanism>BuiltIn</UpdateMechanism></Config>' > /prowlarr/config.xml;
        else
          sed -i 's|<ApiKey>.*</ApiKey>|<ApiKey>${PROWLARR_API_KEY:-prowlarr_internal_secret_key_99}</ApiKey>|g' /prowlarr/config.xml;
          sed -i 's|<AuthenticationMethod>.*</AuthenticationMethod>|<AuthenticationMethod>External</AuthenticationMethod>|g' /prowlarr/config.xml;
          if ! grep -q '<AuthenticationRequired>' /prowlarr/config.xml; then
            sed -i 's|<AuthenticationMethod>External</AuthenticationMethod>|<AuthenticationMethod>External</AuthenticationMethod><AuthenticationRequired>DisabledForLocalAddresses</AuthenticationRequired>|g' /prowlarr/config.xml;
          fi;
        fi;
        chmod -R 777 /prowlarr /slicksync /nuvio /aiometadata /infinidysk /stremio-web /debrid-search /postersplus /aiostreams 2>/dev/null || true;
        if [ ! -f /stremio-web/localStorage.json ]; then echo '{}' > /stremio-web/localStorage.json; fi;
        if [ -f /infinidysk/session.key ]; then chmod 600 /infinidysk/session.key 2>/dev/null || true; fi;
      "

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    profiles: ["scrapers", "all"]
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${PROWLARR_MEM_LIMIT:-384m}
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "${INTERNAL_BIND_IP:-127.0.0.1}:9696:9696"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:9696/ping > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ./data/prowlarr:/config
    networks:
      - stremio-net
    depends_on:
      init-configs:
        condition: service_completed_successfully

  # Automatically provisions FlareSolverr proxy, public indexers, default accounts, AIOStreams template, and Stremio Web
  stack-bootstrap:
    image: python:3.11-alpine
    container_name: stack-bootstrap
    restart: "no"
    logging: *default-logging
    depends_on:
      - aiostreams
    volumes:
      - ./init/bootstrap:/init:ro
      - ./data/stremio-web:/data/stremio-web
      - ./data/aiostreams:/data/aiostreams
      - ./:/app
      - ./templates/builtin:/templates/builtin:ro
      - ./templates/aiometadata-configs:/templates/aiometadata-configs:ro
    environment:
      - PROWLARR_URL=http://prowlarr:9696
      - PROWLARR_API_KEY=${PROWLARR_API_KEY:-prowlarr_internal_secret_key_99}
      - AIO_PRECACHE_NEXT_EPISODE=${AIO_PRECACHE_NEXT_EPISODE:-true}
      - FLARESOLVERR_URL=http://flaresolverr:8191
      - MEDIAFUSION_URL=http://mediafusion:8000
      - MEDIAFUSION_REPLICAS=${MEDIAFUSION_REPLICAS:-0}
      - COMET_URL=http://comet:8000
      - SOOTIO_URL=http://sootio:55771
      - SOOTIO_MODE=${SOOTIO_MODE:-fallback}
      - AIOSTREAMS_URL=http://aiostreams:3000
      - STREMIO_WEB_URL=http://stremio-web:8080
      - AIOMETADATA_URL=http://aiometadata:4005
      - AIOMETADATA_HOST=${AIOMETADATA_HOST:-}
      - POSTERSPLUS_URL=http://postersplus:8000
      - POSTERSPLUS_ACCESS_KEY=${POSTERSPLUS_ACCESS_KEY:-}
      - BASE_URL=${BASE_URL:-http://localhost:3001}
      - ADDON_PASSWORD=${ADDON_PASSWORD:-admin}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@localhost}
      - PREMIUMIZE_API_KEY=${PREMIUMIZE_API_KEY}
      - REALDEBRID_API_KEY=${REALDEBRID_API_KEY}
      - ALLDEBRID_API_KEY=${ALLDEBRID_API_KEY}
      - TORBOX_API_KEY=${TORBOX_API_KEY}
      - DEBRIDLINK_API_KEY=${DEBRIDLINK_API_KEY}
      - EASYDEBRID_API_KEY=${EASYDEBRID_API_KEY}
      - OFFCLOUD_API_KEY=${OFFCLOUD_API_KEY}
      - SEEDR_API_KEY=${SEEDR_API_KEY}
      - EASYNEWS_USER=${EASYNEWS_USER:-}
      - EASYNEWS_PASSWORD=${EASYNEWS_PASSWORD:-}
      - USENET_HOST=${USENET_HOST}
      - USENET_PORT=${USENET_PORT:-563}
      - USENET_USER=${USENET_USER}
      - USENET_PASS=${USENET_PASS}
      - USENET_SSL=${USENET_SSL:-true}
      - TMDB_API_KEY=${TMDB_API_KEY}
      - TVDB_API_KEY=${TVDB_API_KEY}
      - MDBLIST_API_KEY=${MDBLIST_API_KEY}
      - RPDB_API_KEY=${RPDB_API_KEY}
      - FANART_API_KEY=${FANART_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SIMKL_CLIENT_ID=${SIMKL_CLIENT_ID:-}
      - SIMKL_CLIENT_SECRET=${SIMKL_CLIENT_SECRET:-}
      - TRAKT_CLIENT_ID=${TRAKT_CLIENT_ID:-}
      - TRAKT_CLIENT_SECRET=${TRAKT_CLIENT_SECRET:-}
      - ANILIST_CLIENT_ID=${ANILIST_CLIENT_ID:-}
      - ANILIST_CLIENT_SECRET=${ANILIST_CLIENT_SECRET:-}
      - ANILIST_TOKEN=${ANILIST_TOKEN:-}
      - AIOMETADATA_TEMPLATE=${AIOMETADATA_TEMPLATE:-tamtaro-aiometadata-with-anime.json}
    command: python3 -u /init/setup_stack.py
    networks:
      - stremio-net

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    profiles: ["scrapers", "all"]
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${INTERNAL_BIND_IP:-127.0.0.1}:8191:8191"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8191/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    environment:
      - LOG_LEVEL=${FLARESOLVERR_LOG_LEVEL:-info}
      - CAPTCHA_SOLVER=none
      - TZ=Etc/UTC
    mem_limit: ${FLARESOLVERR_MEM_LIMIT:-1024m}
    networks:
      - stremio-net

  # ============================================================================
  # 5. STREAM PROXIES & DEBRID ROUTERS
  # ============================================================================
  stremthru:
    image: muniftanjim/stremthru:latest
    container_name: stremthru
    profiles: ["proxies", "all"]
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${STREMTHRU_MEM_LIMIT:-768m}
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "${INTERNAL_BIND_IP:-127.0.0.1}:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/v0/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      - PORT=8080
      - STREMTHRU_PORT=8080
      - GOMEMLIMIT=384MiB
      - GOGC=80
      - STREMTHRU_FEATURE_DMM_HASHLIST=false
      - STREMTHRU_FEATURE_IMDB_TITLE=false
      - STREMTHRU_FEATURE_ANIME=false
      - STREMTHRU_AUTH=${STREMTHRU_AUTH:-}
      - STREMTHRU_PROXY_AUTH=${STREMTHRU_AUTH:-}
      - STREMTHRU_AUTH_ADMIN=${ADDON_PASSWORD:-}
      - STREMTHRU_VAULT_SECRET=${SECRET_KEY:-e2c019d4536f9a039b56f8f1dfba8919634e2c8846bb1999252c79213bc01b09}
      - STREMTHRU_REDIS_URI=redis://shared-redis:6379/3
      - STREMTHRU_DATABASE_URI=sqlite:///app/data/stremthru.db
      - STREMTHRU_STORE_AUTH=*:realdebrid:${REALDEBRID_API_KEY},*:premiumize:${PREMIUMIZE_API_KEY},*:alldebrid:${ALLDEBRID_API_KEY},*:torbox:${TORBOX_API_KEY},*:debridlink:${DEBRIDLINK_API_KEY},admin:realdebrid:${REALDEBRID_API_KEY},admin:premiumize:${PREMIUMIZE_API_KEY},admin:alldebrid:${ALLDEBRID_API_KEY},admin:torbox:${TORBOX_API_KEY},admin:debridlink:${DEBRIDLINK_API_KEY}
      - TMDB_API_KEY=${TMDB_API_KEY}
      - TVDB_API_KEY=${TVDB_API_KEY}
      - MDBLIST_API_KEY=${MDBLIST_API_KEY}
      - RPDB_API_KEY=${RPDB_API_KEY}
      - STREMTHRU_TMDB_API_KEY=${TMDB_API_KEY}
      - STREMTHRU_TVDB_API_KEY=${TVDB_API_KEY}
      - STREMTHRU_MDBLIST_API_KEY=${MDBLIST_API_KEY}
      - STREMTHRU_RPDB_API_KEY=${RPDB_API_KEY}
    volumes:
      - ./data/stremthru:/app/data
    networks:
      - stremio-net
    depends_on:
      - shared-redis

  mediaflow:
    image: mhdzumair/mediaflow-proxy:latest
    container_name: mediaflow
    profiles: ["proxies", "all"]
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${MEDIAFLOW_MEM_LIMIT:-384m}
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "${INTERNAL_BIND_IP:-127.0.0.1}:8888:8888"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8888/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    environment:
      - PORT=8888
      - API_PASSWORD=${MEDIAFLOW_PASS:-${ADDON_PASSWORD}}
      - REDIS_URL=redis://shared-redis:6379/4
      - ENABLE_STREAMING_PROGRESS=true
      - ENABLE_HLS_PREBUFFER=true
      - HLS_PREBUFFER_SEGMENTS=5
      - ENABLE_DASH_PREBUFFER=true
      - DASH_PREBUFFER_SEGMENTS=5
      - LIVESTREAM_START_OFFSET=-18
      - GUNICORN_WORKERS=${MEDIAFLOW_WORKERS:-2}
      - GUNICORN_TIMEOUT=120
    volumes:
      - ./data/mediaflow:/app/data
    networks:
      - stremio-net
    depends_on:
      - shared-redis

  # InfiniDysk (On-demand Usenet streaming engine & WebDAV provider)
  infinidysk:
    image: ghcr.io/infinidysk/infinidysk:latest
    container_name: infinidysk
    profiles: ["proxies", "usenet", "all"]
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${INFINIDYSK_MEM_LIMIT:-384m}
    ports:
      - "${INTERNAL_BIND_IP:-127.0.0.1}:3005:3000"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - TRUST_PROXY=1
      - RESET_ADMIN_PASSWORD=${RESET_ADMIN_PASSWORD:-false}
      - FRONTEND_BACKEND_API_KEY=${SECRET_KEY:-e2c019d4536f9a039b56f8f1dfba8919634e2c8846bb1999252c79213bc01b09}
      - NZBDAV_CONFIG__API__KEY=${SECRET_KEY:-e2c019d4536f9a039b56f8f1dfba8919634e2c8846bb1999252c79213bc01b09}
      - NZBDAV_CONFIG__WEBDAV__USER=admin
      - NZBDAV_CONFIG__WEBDAV__PASS=${ADDON_PASSWORD:-admin}
      - WEBDAV_USER=admin
      - WEBDAV_PASSWORD=${ADDON_PASSWORD:-admin}
      - NZBDAV_CONFIG__PROWLARR__URL=http://prowlarr:9696
      - NZBDAV_CONFIG__PROWLARR__API_KEY=${PROWLARR_API_KEY:-prowlarr_internal_secret_key_99}
      - NZBDAV_CONFIG__USENET__SEGMENT_CACHE__ENABLED=true
      - NZBDAV_CONFIG__USENET__PROVIDERS=${INFINIDYSK_USENET_PROVIDERS:-}
      - NZBDAV_CONFIG__USENET__SEGMENT_CACHE__MAX_GB=15
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:3000/healthz > /dev/null || exit 1"]
      interval: 30s
      retries: 3
      start_period: 60s
      timeout: 5s
    volumes:
      - ./data/infinidysk:/config
    networks:
      - stremio-net
    depends_on:
      init-configs:
        condition: service_completed_successfully

  # Cloudflare Tunnel (Optional Zero-Trust HTTPS ingress without opening router ports)
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: aio-tunnel
    profiles: ["tunnel"]
    restart: unless-stopped
    logging: *default-logging
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks:
      - stremio-net

  # ============================================================================
  # 6. LOCAL CATALOGS & METADATA
  # ============================================================================

  # Anime Kitsu (TheBeastLT's anime catalog addon built directly from source)
  anime-kitsu:
    build:
      context: .
      dockerfile: docker/anime-kitsu/Dockerfile
    container_name: anime-kitsu
    profiles: ["web", "all"]
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${KITSU_MEM_LIMIT:-256m}
    ports:
      - "${INTERNAL_BIND_IP:-127.0.0.1}:7005:7000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"http=require('http');http.get('http://localhost:7000/manifest.json',r=>{process.exit(r.statusCode===200?0:1)})\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    environment:
      - PORT=7000
      - NODE_OPTIONS=--max-old-space-size=128
      - FANART_APIKEY=${FANART_API_KEY}
    networks:
      - stremio-net

  # AIOMetadata (Rich metadata & streaming provider catalogs: Netflix, Disney+, Apple TV+, Max)
  aiometadata:
    image: ghcr.io/jigsawfr/aiometadata-docker:latest
    container_name: aiometadata
    profiles: ["core", "web", "all"]
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${AIOMETADATA_MEM_LIMIT:-512m}
    ports:
      - "4005:4005"
    environment:
      - PORT=4005
      - HOST_NAME=${AIOMETADATA_HOST:-http://localhost:4005}
      - TMDB_API_KEY=${TMDB_API_KEY}
      - TMDB_API=${TMDB_API_KEY}
      - BUILT_IN_TMDB_API_KEY=${TMDB_API_KEY}
      - TVDB_API_KEY=${TVDB_API_KEY}
      - BUILT_IN_TVDB_API_KEY=${TVDB_API_KEY}
      - FANART_API_KEY=${FANART_API_KEY}
      - RPDB_API_KEY=${RPDB_API_KEY}
      - MDBLIST_API_KEY=${MDBLIST_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SIMKL_CLIENT_ID=${SIMKL_CLIENT_ID:-}
      - SIMKL_CLIENT_SECRET=${SIMKL_CLIENT_SECRET:-}
      - TRAKT_CLIENT_ID=${TRAKT_CLIENT_ID:-}
      - TRAKT_CLIENT_SECRET=${TRAKT_CLIENT_SECRET:-}
      - ANILIST_CLIENT_ID=${ANILIST_CLIENT_ID:-}
      - ANILIST_CLIENT_SECRET=${ANILIST_CLIENT_SECRET:-}
      - REDIS_URL=redis://shared-redis:6379/5
      - DATABASE_URI=postgresql://postgres:${POSTGRES_PASSWORD:-postgres_supersecret_db_pass_2026}@shared-postgres:5432/aiometadata
      - ADMIN_KEY=${SECRET_KEY:-e2c019d4536f9a039b56f8f1dfba8919634e2c8846bb1999252c79213bc01b09}
      - ADDON_PASSWORD=${ADDON_PASSWORD:-admin}
      - IMAGE_PROXY_SIGNING_SECRET=${SECRET_KEY:-e2c019d4536f9a039b56f8f1dfba8919634e2c8846bb1999252c79213bc01b09}
      - CACHE_WARMUP_ON_STARTUP=true
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=384
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:4005/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    volumes:
      - ./data/aiometadata:/app/addon/data
    networks:
      - stremio-net
    depends_on:
      shared-redis:
        condition: service_started
      shared-postgres:
        condition: service_started
      init-postgres:
        condition: service_completed_successfully
      init-configs:
        condition: service_completed_successfully

  # Posters+ (Dynamic poster rating overlays, Oscars/Emmy badges, 4K/HDR quality badges)
  postersplus:
    image: ghcr.io/umbraprojects/postersplus:latest
    container_name: postersplus
    profiles: ["core", "web", "all"]
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${POSTERSPLUS_MEM_LIMIT:-384m}
    ports:
      - "${INTERNAL_BIND_IP:-127.0.0.1}:9039:8000"
    environment:
      - PORT=8000
      - TMDB_API_KEY=${TMDB_API_KEY}
      - MDBLIST_API_KEY=${MDBLIST_API_KEY}
      - RPDB_API_KEY=${RPDB_API_KEY}
      - ACCESS_KEY=${POSTERSPLUS_ACCESS_KEY:-}
      - AIOSTREAMS_URL=http://aiostreams:3000
      - CACHE_DIR=/app/cache
    volumes:
      - ./data/postersplus:/app/cache
    networks:
      - stremio-net
    depends_on:
      init-configs:
        condition: service_completed_successfully

  # Stremio-IntellDebridSearch (Search & catalog provider for personal Real-Debrid / TorBox / Premiumize / AllDebrid library)
  debrid-search:
    image: nepiraw/stremio-intelldebridsearch:latest
    container_name: stremio-debrid-search
    profiles: ["scrapers", "all"]
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${DEBRID_SEARCH_MEM_LIMIT:-384m}
    ports:
      - "${INTERNAL_BIND_IP:-127.0.0.1}:${PORT_DEBRID_SEARCH:-3011}:3011"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"http=require('http');http.get('http://localhost:3011/manifest.json',r=>{process.exit(r.statusCode===200?0:1)})\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    environment:
      - PORT=3011
      - NODE_OPTIONS=--max-old-space-size=256
      - ADDON_URL=${DEBRID_SEARCH_URL:-http://localhost:3011}
      - TMDB_API_KEY=${TMDB_API_KEY}
      - TVDB_API_KEY=${TVDB_API_KEY}
      - REALDEBRID_API_KEY=${REALDEBRID_API_KEY}
      - ALLDEBRID_API_KEY=${ALLDEBRID_API_KEY}
      - TORBOX_API_KEY=${TORBOX_API_KEY}
      - PREMIUMIZE_API_KEY=${PREMIUMIZE_API_KEY}
      - DEBRIDLINK_API_KEY=${DEBRIDLINK_API_KEY}
      - ENABLE_CATALOG_POSTERS=true
      - CATALOG_ENRICHMENT_CACHE_ENABLED=true
      - CATALOG_ENRICHMENT_CACHE_DB_PATH=/app/data/catalog-cache.sqlite
      - VARIANT_SYSTEM_ENABLED=true
      - ENABLE_RELEASE_GROUP=true
      - WARP_ENABLED=true
    volumes:
      - ./data/debrid-search:/app/data
    networks:
      - stremio-net
    depends_on:
      init-configs:
        condition: service_completed_successfully

  # SubSense (Multi-provider subtitle aggregator: OpenSubtitles, SubSource, SubDL, YIFY)
  subsense:
    image: nepiraw/stremio-subsense:latest
    container_name: stremio-subsense
    profiles: ["core", "web", "all"]
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${SUBSENSE_MEM_LIMIT:-384m}
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "${INTERNAL_BIND_IP:-127.0.0.1}:${PORT_SUBSENSE:-3100}:3100"
    environment:
      - PORT=3100
      - HOST=0.0.0.0
      - NODE_OPTIONS=--max-old-space-size=192
      - SUBSENSE_ENCRYPTION_KEY=${SECRET_KEY:-e2c019d4536f9a039b56f8f1dfba8919634e2c8846bb1999252c79213bc01b09}
      - REDIS_URL=redis://shared-redis:6379/1
      - WARP_ENABLED=true
      - LOG_LEVEL=info
      - OPENSUBTITLES_API_KEY=${OPENSUBTITLES_API_KEY:-}
      - SUBDL_API_KEY=${SUBDL_API_KEY:-}
    volumes:
      - ./data/subsense:/app/data
    networks:
      - stremio-net
    depends_on:
      - shared-redis

  # ============================================================================
  # 7. WEB PLAYERS & STREAM CLIENTS (NUVIO & STREMIO WEB)
  # ============================================================================
  nuvio:
    image: orochibraru/nuvio-web:latest
    container_name: nuvio-web
    profiles: ["web", "all"]
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    ports:
      - "${INTERNAL_BIND_IP:-127.0.0.1}:8085:3000"   # Nuvio Web UI & Embedded Player
    environment:
      - ORIGIN=${NUVIO_ORIGIN:-http://localhost:8085}
      - PROTOCOL_HEADER=x-forwarded-proto
      - HOST_HEADER=x-forwarded-host
    volumes:
      - ./data/nuvio:/app/data
    networks:
      - stremio-net
    depends_on:
      init-configs:
        condition: service_completed_successfully

  # Stremio Web Player & Server (Official Web UI bundled with local streaming server engine)
  stremio-web:
    image: tsaridas/stremio-docker:latest
    container_name: stremio-web
    profiles: ["web", "all"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    restart: unless-stopped
    ports:
      - "${INTERNAL_BIND_IP:-127.0.0.1}:8082:8080"   # Stremio Web UI & Streaming Engine
    environment:
      - AUTO_SERVER_URL=false
    entrypoint: ["/bin/sh", "/aio-entrypoint.sh"]
    volumes:
      - ./data/stremio-web:/root/.stremio-server
      - ./data/stremio-web:/aio-config:ro
      - ./docker/stremio-web/entrypoint.sh:/aio-entrypoint.sh:ro
      - ./docker/stremio-web/bootstrap.js:/srv/stremio-server/build/aio-bootstrap.js:ro
    networks:
      - stremio-net
    depends_on:
      init-configs:
        condition: service_completed_successfully

  # ============================================================================
  # 8. NUVIO & STREMIO SYNC HUB (SLICKSYNC)
  # ============================================================================
  slicksync:
    image: ghcr.io/slicknsliding/slicksync:private
    container_name: slicksync
    profiles: ["web", "all"]
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${SLICKSYNC_MEM_LIMIT:-384m}
    ports:
      - "${INTERNAL_BIND_IP:-127.0.0.1}:8086:3000"   # SlickSync Web UI & Management Dashboard
    environment:
      - JWT_SECRET=${SECRET_KEY:-e2c019d4536f9a039b56f8f1dfba8919634e2c8846bb1999252c79213bc01b09}
      - ENCRYPTION_KEY=${SECRET_KEY:-e2c019d4536f9a039b56f8f1dfba8919634e2c8846bb1999252c79213bc01b09}
      - SLICKSYNC_PRIVATE_USERNAME=admin
      - SLICKSYNC_PRIVATE_PASSWORD=${ADDON_PASSWORD:-admin}
      - REDIS_URL=redis://shared-redis:6379/2
      - AIOSTREAMS_URL=http://aiostreams:3000
      - AIOSTREAMS_AUTH_USERNAME=admin
      - AIOSTREAMS_AUTH_PASSWORD=${ADDON_PASSWORD:-admin}
      - SIMKL_CLIENT_SECRET=${SIMKL_CLIENT_SECRET:-}
      - ANILIST_CLIENT_ID=${ANILIST_CLIENT_ID:-}
      - ANILIST_CLIENT_SECRET=${ANILIST_CLIENT_SECRET:-}
      - STREMIO_URL=http://aiostreams:3000
      - NODE_OPTIONS=--dns-result-order=ipv4first --max-old-space-size=256
      - SIMKL_CLIENT_ID=${SIMKL_CLIENT_ID:-}
      - TRAKT_CLIENT_ID=${TRAKT_CLIENT_ID:-}
      - TRAKT_CLIENT_SECRET=${TRAKT_CLIENT_SECRET:-}
    volumes:
      - ./data/slicksync:/app/data
    networks:
      - stremio-net
    depends_on:
      shared-redis:
        condition: service_started
      aiostreams:
        condition: service_started
      init-configs:
        condition: service_completed_successfully

  # ============================================================================
  # 9. SUPPORTING SHARED DATABASES
  # ============================================================================
  shared-redis:
    image: redis:alpine
    container_name: shared-redis
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${REDIS_MEM_LIMIT:-256m}
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - stremio-net

  # One-shot database initializer ensuring all application databases exist on existing volumes
  init-postgres:
    image: postgres:16-alpine
    container_name: init-postgres
    restart: "no"
    logging: *default-logging
    depends_on:
      shared-postgres:
        condition: service_healthy
    environment:
      - PGPASSWORD=${POSTGRES_PASSWORD:-postgres_supersecret_db_pass_2026}
    volumes:
      - ./init/postgres/init-databases.sh:/init-databases.sh:ro
    entrypoint:
      - sh
      - -c
      - |
        if [ -f /init-databases.sh ]; then
          exec sh /init-databases.sh
        else
          echo "[init-postgres] Waiting for shared-postgres..."
          until psql -h shared-postgres -U postgres -d postgres -c "SELECT 1;" >/dev/null 2>&1; do sleep 1; done
          for db in zilean mediafusion aiometadata sootio; do
            psql -h shared-postgres -U postgres -d postgres -c "CREATE DATABASE $$db;" 2>/dev/null || true
          done
          echo "[init-postgres] Done!"
          exit 0
        fi
    networks:
      - stremio-net

  shared-postgres:
    image: postgres:16-alpine
    container_name: shared-postgres
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${POSTGRES_MEM_LIMIT:-512m}
    shm_size: 512mb
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres_supersecret_db_pass_2026}
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./init/postgres/01-init-dbs.sql:/docker-entrypoint-initdb.d/01-init-dbs.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks:
      - stremio-net

networks:
  stremio-net:
    driver: bridge

volumes:
  control-socket:
